<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crown Quest: A Fantasy Adventure — a modern Sierra-style tribute adventure built with HTML5 Canvas and JavaScript.">
    <meta name="theme-color" content="#140f08">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self'; connect-src 'self'; img-src 'self' data:;">
    <meta property="og:title" content="Crown Quest: A Fantasy Adventure">
    <meta property="og:description" content="A modern Sierra-style fantasy adventure tribute. From the sorcerer's scullery to the throne of Alderhaven.">
    <meta property="og:type" content="website">
    <title>Crown Quest: A Fantasy Adventure</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>👑</text></svg>">
    <link rel="apple-touch-icon" href="icons/crown-192.svg">
    <link rel="manifest" href="manifest.json">
    <style>
        /* Bundled pixel/bitmap typeface (VT323, SIL OFL 1.1 — see fonts/VT323-OFL.txt).
           Declared under the 'Courier New' family so every existing reference across the
           DOM chrome and the canvas render path (~160 call sites) adopts the Sierra-style
           pixel font with zero churn. The weight range maps bold requests onto the single
           pixel face to avoid faux-bold smearing, and local('Courier New') is the last-resort
           fallback if the woff2 is unavailable before it is cached. */
        @font-face {
            font-family: 'Courier New';
            src: url('fonts/vt323-latin-400-normal.woff2') format('woff2'),
                 local('Courier New'), local('Courier');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #080818;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Courier New', Courier, monospace;
            color: #e0e0e0;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 644px;
            max-width: 100vw;
            border: 3px solid #222244;
            background: #0a0a1a;
            box-shadow: 0 0 80px rgba(30,30,100,0.6), inset 0 0 20px rgba(0,0,0,0.8);
            border-radius: 6px;
            overflow: hidden;
        }
        #title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: linear-gradient(to right, #0000AA, #000066);
            border-bottom: 2px solid #5555FF;
            font-size: 18px;
            text-shadow: 1px 1px 0 #000;
        }
        #game-title {
            color: #FFFFFF;
            font-weight: bold;
            letter-spacing: 1.5px;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 640 / 400;
            cursor: crosshair;
            image-rendering: pixelated;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            background: #000;
            border-bottom: 1px solid #222;
            touch-action: none;
        }
        body.classic-mode #game-container {
            width: 640px;
            border: none;
            border-radius: 0;
            box-shadow: none;
            background: #000;
        }
        body.classic-mode #title-bar,
        body.classic-mode #action-bar,
        body.classic-mode #inventory-bar,
        body.classic-mode #save-load-bar,
        body.classic-mode #message-area,
        body.classic-mode #dpad {
            display: none;
        }
        body.classic-mode #game-canvas {
            cursor: default;
            border-bottom: none;
        }
        body.title-screen #title-bar,
        body.title-screen #action-bar,
        body.title-screen #inventory-bar,
        body.title-screen #save-load-bar,
        body.title-screen #touch-parser,
        body.title-screen #message-area,
        body.title-screen #dpad {
            display: none;
        }
        .sr-only {
            position: fixed;
            left: -10000px;
            top: auto;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
        #action-bar {
            display: flex;
            gap: 2px;
            padding: 5px 6px;
            background: linear-gradient(to bottom, #0000AA, #000088);
            border-top: 1px solid #5555FF;
            border-bottom: 1px solid #5555FF;
        }
        .action-btn {
            flex: 1;
            padding: 8px 4px;
            background: #000088;
            border: 1px solid #5555FF;
            color: #AAAAAA;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
            text-shadow: 1px 1px 0 #000;
        }
        .action-btn:hover { background: #0000CC; color: #FFFFFF; transform: translateY(-1px); }
        .action-btn:active { transform: translateY(1px); }
        .action-btn.active {
            background: #5555FF;
            border-color: #FFFFFF;
            color: #FFFFFF;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        #inventory-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: linear-gradient(to right, #000066, #0000AA);
            border-bottom: 1px solid #333388;
            min-height: 42px;
        }
        #inv-label {
            font-size: 14px;
            color: #AAAAAA;
            white-space: nowrap;
            text-shadow: 1px 1px 0 #000;
        }
        #inventory-items {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            flex: 1;
        }
        .inv-item {
            padding: 5px 9px;
            background: #000088;
            border: 1px solid #5555FF;
            border-radius: 2px;
            font-family: inherit;
            line-height: normal;
            font-size: 14px;
            cursor: pointer;
            color: #AAAAAA;
            transition: all 0.15s ease;
            white-space: nowrap;
            text-shadow: 1px 1px 0 #000;
        }
        .inv-item:hover { background: #0000CC; color: #FFFFFF; transform: translateY(-1px); }
        .inv-item:active { transform: translateY(1px); }
        .inv-item.selected {
            border-color: #FFFF55;
            color: #FFFF55;
            background: #0000AA;
            box-shadow: 0 0 5px rgba(255,255,85,0.3);
        }
        #message-area {
            padding: 10px 14px;
            background: linear-gradient(to bottom, #0000AA, #000066);
            border-top: 1px solid #5555FF;
            min-height: 64px;
            max-height: 88px;
            overflow-y: auto;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }
        #message-text {
            font-size: 16px;
            line-height: 1.5;
            color: #FFFFFF;
            text-shadow: 1px 1px 0 #000;
        }
        #message-area::-webkit-scrollbar { width: 6px; }
        #message-area::-webkit-scrollbar-track { background: #000088; }
        #message-area::-webkit-scrollbar-thumb { background: #5555FF; border-radius: 0; }
        .save-btn {
            padding: 7px 12px;
            background: #000088;
            border: 1px solid #5555FF;
            border-radius: 2px;
            color: #AAAAAA;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-shadow: 1px 1px 0 #000;
        }
        .save-btn:hover { background: #0000CC; color: #FFFFFF; transform: translateY(-1px); }
        .save-btn:active { transform: translateY(1px); }
        .vr-launch-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 50;
            background: #005522;
            border-color: #55FF88;
            color: #FFFFFF;
        }
        .vr-launch-btn.active {
            background: #660000;
            border-color: #FF7777;
        }
        #save-load-bar {
            display: flex;
            gap: 6px;
            padding: 5px 10px;
            background: linear-gradient(to right, #000066, #0000AA);
            border-top: 1px solid #333388;
            align-items: center;
        }
        #btn-tools { display: none; }
        #touch-parser {
            display: none;
            gap: 6px;
            padding: 6px;
            background: #000066;
            border-top: 1px solid #5555FF;
        }
        #touch-parser-input {
            min-width: 0;
            flex: 1;
            padding: 8px;
            border: 1px solid #FFFFFF;
            background: #000000;
            color: #FFFFFF;
            font: 16px 'Courier New', monospace;
            text-transform: uppercase;
        }
        #save-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        #save-modal.open { display: flex; }
        #save-modal-inner {
            background: linear-gradient(to bottom, #0000AA, #000066);
            border: 2px solid #5555FF;
            padding: 20px 28px;
            min-width: 360px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border-radius: 4px;
        }
        #save-modal-inner h3 {
            margin: 0 0 14px 0;
            color: #FFFF55;
            font-size: 18px;
            text-align: center;
            text-shadow: 1px 1px 0 #000;
        }
        .slot-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 6px;
            border-bottom: 1px solid #223;
        }
        .slot-row:last-child { border-bottom: none; }
        .slot-info {
            flex: 1;
            font-size: 12px;
            color: #AAAAAA;
        }
        .slot-info .slot-name { color: #FFFFFF; font-weight: bold; }
        .slot-info .slot-detail { color: #5555FF; font-size: 10px; }
        .slot-action {
            padding: 5px 12px;
            background: #000088;
            border: 1px solid #5555FF;
            border-radius: 2px;
            color: #FFFFFF;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-shadow: 1px 1px 0 #000;
        }
        .slot-action:hover { background: #0000CC; color: #FFFFFF; transform: translateY(-1px); }
        .slot-action:active { transform: translateY(1px); }
        .slot-action.delete { border-color: #AA0000; }
        .slot-action.delete:hover { background: #AA0000; }
        #save-modal-close {
            display: block;
            margin: 16px auto 0;
            padding: 8px 24px;
            background: #000088;
            border: 1px solid #5555FF;
            border-radius: 2px;
            color: #FFFFFF;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-shadow: 1px 1px 0 #000;
        }
        #save-modal-close:hover { background: #0000CC; transform: translateY(-1px); }
        #save-modal-close:active { transform: translateY(1px); }

        /* D-pad for mobile */
        #dpad {
            display: none;
            position: relative;
            width: 120px;
            height: 120px;
            margin: 6px auto;
            flex-shrink: 0;
        }
        .dpad-btn {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #000088;
            border: 1px solid #5555FF;
            border-radius: 4px;
            color: #AAAAAA;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-touch-callout: none;
            touch-action: none;
            transition: all 0.15s ease;
            text-shadow: 1px 1px 0 #000;
        }
        .dpad-btn:active { background: #5555FF; color: #FFFFFF; transform: scale(0.95); }
        #dpad-up    { top: 0;   left: 40px; }
        #dpad-down  { top: 80px; left: 40px; }
        #dpad-left  { top: 40px; left: 0; }
        #dpad-right { top: 40px; left: 80px; }
        #dpad-center {
            position: absolute;
            top: 40px; left: 40px;
            width: 40px; height: 40px;
            background: #000055;
            border: 1px solid #333388;
            border-radius: 4px;
        }

        /* Responsive layout for small screens */
        @media (max-width: 660px) {
            body {
                align-items: flex-start;
                overflow-y: auto;
                overflow-x: hidden;
            }
            #game-container {
                width: 100vw;
                border: none;
                border-radius: 0;
                box-shadow: none;
            }
            #title-bar {
                padding: 6px 10px;
                font-size: 15px;
            }
            .action-btn {
                padding: 8px 4px;
                font-size: 15px;
            }
            .inv-item {
                padding: 5px 8px;
                font-size: 14px;
            }
            .save-btn {
                padding: 7px 10px;
                font-size: 14px;
            }
            #save-load-bar > #btn-save,
            #save-load-bar > #btn-load,
            #save-load-bar > #btn-mute,
            #save-load-bar > #btn-text-speed {
                display: none;
            }
            #save-load-bar.tools-open > #btn-save,
            #save-load-bar.tools-open > #btn-load,
            #save-load-bar.tools-open > #btn-mute,
            #save-load-bar.tools-open > #btn-text-speed {
                display: block;
            }
            #btn-tools {
                display: block;
                margin-left: auto;
            }
            #message-area {
                min-height: 56px;
                max-height: 88px;
            }
            #message-text {
                font-size: 14px;
            }
            #dpad {
                display: flex;
                position: relative;
                width: 100%;
                height: 36px;
                margin: 0;
                padding: 2px 6px;
                gap: 4px;
                justify-content: center;
                background: #000066;
                border-top: 1px solid #333388;
            }
            .dpad-btn {
                position: static;
                width: 48px;
                height: 32px;
                font-size: 15px;
            }
            #dpad-up,
            #dpad-down,
            #dpad-left,
            #dpad-right { top: auto; left: auto; }
            #dpad-center {
                display: none;
            }
            #save-modal-inner {
                min-width: 0;
                width: 90vw;
                padding: 14px;
            }
        }
        @media (pointer: coarse) {
            body.classic-mode:not(.title-screen) #save-load-bar,
            body.classic-mode:not(.title-screen) #touch-parser {
                display: flex;
            }
            body.classic-mode:not(.title-screen) #dpad {
                display: block;
            }
            body.classic-mode:not(.title-screen) #message-area {
                display: block;
            }
        }
    </style>
</head>
<body class="classic-mode title-screen">
    <h1 class="sr-only">Crown Quest: A Fantasy Adventure</h1>
    <main id="game-container">
        <div id="title-bar">
            <span id="game-title">&#9819; CROWN QUEST: A Fantasy Adventure</span>
        </div>
        <canvas id="game-canvas" width="640" height="400" aria-label="Game screen" role="img">Your browser does not support the canvas element.</canvas>
        <div id="action-bar">
            <button class="action-btn active" type="button" data-action="walk">Walk</button>
            <button class="action-btn" type="button" data-action="look">Look</button>
            <button class="action-btn" type="button" data-action="get">Get</button>
            <button class="action-btn" type="button" data-action="use">Use</button>
            <button class="action-btn" type="button" data-action="talk">Talk</button>
        </div>
        <div id="inventory-bar">
            <span id="inv-label">Inventory:</span>
            <div id="inventory-items" role="group" aria-labelledby="inv-label"></div>
        </div>
        <div id="save-load-bar">
            <button class="save-btn" type="button" id="btn-save" title="Save Game (F5)">Save</button>
            <button class="save-btn" type="button" id="btn-load" title="Load Game (F7)">Load</button>
            <button class="save-btn" type="button" id="btn-scan" aria-pressed="false" title="Highlight interactive objects (F2)">Objects</button>
            <button class="save-btn" type="button" id="btn-hint" title="Show a hint">Hint</button>
            <button class="save-btn" type="button" id="btn-mute" title="Toggle Sound (M)">Sound: ON</button>
            <button class="save-btn" type="button" id="btn-text-speed" title="Text reading speed (F8)">Text: NORMAL</button>
            <button class="save-btn" type="button" id="btn-tools" aria-expanded="false" title="Show game tools">Tools</button>
        </div>
        <form id="touch-parser" autocomplete="off">
            <input id="touch-parser-input" type="text" maxlength="64" aria-label="Classic parser command" placeholder="TYPE A COMMAND">
            <button class="save-btn" type="submit">Send</button>
            <button class="save-btn" type="button" id="btn-enhanced">Enhanced</button>
        </form>
        <div id="dpad">
            <div id="dpad-center"></div>
            <button class="dpad-btn" id="dpad-left" aria-label="Left">&#9664;</button>
            <button class="dpad-btn" id="dpad-up" aria-label="Up">&#9650;</button>
            <button class="dpad-btn" id="dpad-down" aria-label="Down">&#9660;</button>
            <button class="dpad-btn" id="dpad-right" aria-label="Right">&#9654;</button>
        </div>
        <div id="message-area" aria-live="polite">
            <p id="message-text">Choose Classic Parser or Enhanced Click to begin.</p>
        </div>
    </main>
    <div id="canvas-accessibility" class="sr-only" role="status" aria-live="polite" aria-atomic="true">Choose Classic Parser or Enhanced Click to begin.</div>
    <section id="dialog-accessibility" class="sr-only" aria-label="Conversation choices">
        <div id="dialog-accessibility-options"></div>
    </section>
    <div id="save-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div id="save-modal-inner">
            <h3 id="modal-title">Save Game</h3>
            <div id="slot-list"></div>
            <button id="save-modal-close">Cancel</button>
        </div>
    </div>
    <script src="js/palette.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/engine.js"></script>
    <script type="module" src="js/vr.js"></script>
    <script src="js/content.js"></script>
    <script src="js/registry.js"></script>
    <script src="js/art.js"></script>
    <script src="js/actors.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/cutscenes.js"></script>
    <script src="js/rooms/act1.js"></script>
    <script src="js/rooms/act2.js"></script>
    <script src="js/rooms/act3.js"></script>
    <script src="js/game.js"></script>
    <script src="js/register-sw.js"></script>
</body>
</html>
